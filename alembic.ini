# Alembic configuration for PS-05.
# `sqlalchemy.url` is left empty: alembic/env.py fills it from
# Settings.database_url when the env var is set.

[alembic]
script_location = alembic
prepend_sys_path = .
# Default when no DATABASE_URL is configured (in-memory sqlite for tests).
sqlalchemy.url = sqlite+aiosqlite:///:memory:

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = plain

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = plain

[formatter_plain]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
