[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ps05-forensics"
version = "0.1.0"
description = "Digital Evidence Authenticity & Integrity Verification Platform (Bihar Cyber Hackathon PS-05)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary / Government of Bihar Cyber Police Hackathon 2026" }
authors = [
    { name = "PS-05 Engineering Team", email = "forensics-team@cdac-bihar.gov.in" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows"
]

dependencies = [
    # Core API & Runtime
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",

    # Cryptography & Integrity
    "cryptography>=42.0.0",
    "pyOpenSSL>=24.0.0",

    # Database & Storage
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis>=5.0.2",
    "celery>=5.3.6",
    "minio>=7.2.5",

    # Media I/O & Signal Processing
    "soundfile>=0.12.1",
    "librosa>=0.10.1",
    "scipy>=1.12.0",
    "numpy>=1.26.0,<2.0.0",
    "Pillow>=10.2.0",
    "piexif>=1.1.3",
    "opencv-python-headless>=4.9.0",
    "pytesseract>=0.3.10",

    # ML & Deepfake Inference Frameworks
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "speechbrain>=0.5.16",
    "transformers>=4.38.0",

    # Reporting & Legal PDF Compilation
    "jinja2>=3.1.3",
    "weasyprint>=61.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.98.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "types-Pillow>=10.2.0",
    "types-redis>=4.6.0"
]

[project.scripts]
ps05 = "ps05.cli.main:cli_entrypoint"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
